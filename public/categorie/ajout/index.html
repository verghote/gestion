<div class="page-card">
    <div class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Ajout d'une catégorie
            </h1>
        </div>
    </div>
    <div class="page-body">
        <div class="formulaire" id="formulaire">
            <div id="msg"></div>
            <div class="zone-informations-formulaire">
                <section class="bloc-info">
                    <h2>🆔 Identité</h2>
                    <div class="champ">
                        <label for="id" class="obligatoire">
                            Code
                            <span class="commentaire">(2 ou 3 caractères alphanumériques, en commençant par une lettre)</span>
                        </label>
                        <input id="id"
                               type="text"
                               required
                               pattern="^(M(10|[0-9])|[A-Z]{2})$"
                               minlength="2"
                               maxlength="3">
                    </div>
                    <div class="champ">
                        <label for="nom" class="obligatoire">
                            Nom
                            <span class="commentaire">(5 à 20 caractères, lettres non accentuées avec 1 ou 2 chiffres à la fin)</span>
                        </label>
                        <input id="nom"
                               type="text"
                               required
                               pattern="^[A-Za-z]+(?: [A-Za-z]+)*(?: \d{1,2})?$"
                               minlength="5"
                               maxlength="20">
                    </div>
                </section>
                <section class="bloc-info">
                    <h2>📊 Tranche d'âge</h2>
                    <div class="champ">
                        <label for="ageMin" class="obligatoire">
                            Âge minimum
                        </label>
                        <input id="ageMin"
                               type="number"
                               required
                               min="4"
                               max="99">
                    </div>
                    <div class="champ">
                        <label for="ageMax" class="obligatoire">
                            Âge maximum
                        </label>
                        <input id="ageMax"
                               type="number"
                               required
                               min="4"
                               max="99">
                    </div>
                </section>
            </div>
                <button id="btnAjouter">Ajouter</button>
            </div>
        </div>
    </div>
</div>
