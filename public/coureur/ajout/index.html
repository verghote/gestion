<div class="page-card">
    <header class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Ajouter un coureur
            </h1>
        </div>
    </header>

    <div class="page-body">
        <div class="formulaire" id="formulaire">
            <div id="msg"></div>
            <div class="zone-informations-formulaire">
                <section class="bloc-info">
                    <h2>👤 Identité</h2>
                    <div class="champ">
                        <label for="nom" class="obligatoire">
                            Nom
                            <span class="commentaire">(30 caractères max)</span>
                        </label>
                        <input
                                id="nom"
                                type="text"
                                required
                                pattern="^[A-Za-z]( ?[A-Za-z])*$"
                                maxlength="30"
                                minlength="3">
                    </div>
                    <div class="champ">
                        <label for="prenom" class="obligatoire">
                            Prénom
                            <span class="commentaire">(30 caractères max)</span>
                        </label>
                        <input
                                id="prenom"
                                type="text"
                                required
                                pattern="^[A-Za-z]( ?[A-Za-z])*$"
                                maxlength="30"
                                minlength="3">
                    </div>
                    <div class="champ">
                        <label for="sexe">
                            Sexe
                        </label>
                        <select id="sexe">
                            <option value="M">Homme</option>
                            <option value="F">Femme</option>
                        </select>
                    </div>
                    <div class="champ">
                        <label for="dateNaissance">
                            Date de naissance
                        </label>
                        <input
                                id="dateNaissance"
                                type="date"
                                required>
                    </div>
                    <div class="champ">
                        <label for="email">
                            Adresse mail
                        </label>
                        <input
                                id="email"
                                type="email">
                    </div>
                    <div class="champ">
                        <label for="telephone">
                            Téléphone portable
                            <span class="commentaire">(06/07XXXXXXXX)</span>
                        </label>
                        <input
                                id="telephone"
                                type="text"
                                pattern="^0(6|7)[0-9]{8}$"
                                maxlength="10"
                                minlength="10">
                    </div>
                </section>
                <section class="bloc-info">
                    <h2>🏆 Informations sportives</h2>
                    <div class="champ">
                        <label for="licence" class="obligatoire">
                            Licence
                            <span class="commentaire">(6-7 chiffres)</span>
                        </label>
                        <input
                                id="licence"
                                type="text"
                                placeholder="6 ou 7 chiffres"
                                required
                                minlength="6"
                                maxlength="7"
                                pattern="^[0-9]{6,7}$">
                    </div>
                    <div class="champ">
                        <label for="idCategorie">
                            Catégorie
                        </label>
                        <output
                                id="idCategorie"
                                class="champ-sortie">
                        </output>
                    </div>
                    <div class="champ">
                        <label for="idClub" class="obligatoire">
                            Club
                        </label>
                        <select id="idClub"></select>
                    </div>
                    <div class="ligne-checkbox">
                        <input
                                type="checkbox"
                                id="ffa">
                        <label for="ffa">
                            Validé par le Web Service de la FFA
                        </label>
                    </div>
                </section>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button id="btnAjouter" class="w-100 btn btn-outline-danger">
                    ✚ Ajouter
                </button>
            </div>
        </div>
    </div>
</div>
