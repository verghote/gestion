<div class="page-card">
    <div class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Nouveau projet
            </h1>
        </div>
    </div>
    <div class="page-body">
        <div class="formulaire">
            <div id="msg"></div>
            <label for="nom" class="obligatoire ">Nom du projet </label>
            <input id="nom"
                   type="text"
                   minlength="10"
                   maxlength="300"
                   required
                   placeholder="Nom du projet"
            >
            <h5 class="mb-0">Liste des compétences du bloc 1 couvertes par ce projet</h5>
            <div id="listeCompetence" class=""></div>
            <div class="text-center m-2">
                <button class="btn btn-outline-danger" id="btnEnregistrer">Enregistrer le projet et ses compétences
                </button>
            </div>
        </div>
    </div>
