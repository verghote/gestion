
<div class="page-card">
    <div class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Mise à jour des projets
            </h1>
        </div>
    </div>

    <div class="page-body">
        <table>
            <thead>
            <tr>
                <th style="width:60px; color:red; text-align:center"></th>
                <th>Projet</th>
            </tr>
            </thead>

            <tbody id="lesLignes"></tbody>
        </table>
    </div>
</div>

<!-- Modèle d'une ligne projet -->
<template id="modeleLigne">
    <tr class="align-middle">
        <td class="td-actions">
            <button
                    type="button"
                    class="bouton-action btn-modifier"
                    title="Modifier l'enregistrement"
                    aria-label="Modifier le projet"
                    style="color:orange; background:none">
                ✎
            </button>

            <button
                    type="button"
                    class="bouton-action btn-supprimer"
                    title="Supprimer l'enregistrement"
                    aria-label="Supprimer le projet"
                    style="color:red; background:none">
                ✘
            </button>
        </td>

        <td class="td-nom">
            <input
                    type="text"
                    class="form-control input-nom"
                    style="width:600px"
                    aria-label="Nom du projet">
        </td>
    </tr>
</template>
